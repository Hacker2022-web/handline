<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Handline — your gestures, your words</title><desc id="desc">An isometric gesture recognition interface in deep forest green and luminous mint.</desc>
